name: Release builds

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  DIOXUS_CLI_VERSION: 0.7.10

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}

      - name: Build DMG
        working-directory: packages/desktop
        run: dx bundle --platform desktop --release --features bundle --package-types dmg --out-dir ../../release

      - name: Stage DMG
        uses: actions/upload-artifact@v4
        with:
          name: vesper-macos
          path: release/*.dmg
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}

      - name: Build NSIS installer
        working-directory: packages/desktop
        run: dx bundle --platform desktop --release --features bundle --package-types nsis --out-dir ../../release

      - name: Stage installer
        uses: actions/upload-artifact@v4
        with:
          name: vesper-windows
          path: release/*.exe
          if-no-files-found: error

  linux:
    name: Linux AppImage (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      # GitHub runners do not expose FUSE devices. This tells the AppImage
      # tooling downloaded by Dioxus to extract itself before running.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}

      - name: Build AppImage
        working-directory: packages/desktop
        run: dx bundle --platform desktop --release --features bundle --target ${{ matrix.target }} --package-types appimage --out-dir ../../release

      - name: Stage AppImage
        uses: actions/upload-artifact@v4
        with:
          name: vesper-linux-${{ matrix.arch }}
          path: release/*.AppImage
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # No release keystore is configured. Dioxus therefore uses Android's
      # disposable debug key, which keeps the APK sideloadable without secrets.
      - name: Build sideloadable APK (no release key)
        working-directory: packages/mobile
        run: dx bundle --platform android --release --package-types apk --out-dir ../../release

      - name: Stage APK
        uses: actions/upload-artifact@v4
        with:
          name: vesper-android
          path: release/*.apk
          if-no-files-found: error

  publish:
    name: Attach release assets
    needs: [macos, windows, linux, android]
    runs-on: ubuntu-24.04
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vesper-*
          path: release
          merge-multiple: true

      - name: Upload artifacts to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/* --clobber
