[package]
name = "ui"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
default = []
# Enables the custom-titlebar chrome (drag regions, window controls).
desktop = ["dioxus/desktop"]

[dependencies]
dioxus = { workspace = true, features = ["router"] }
async-trait = "0.1"
regex = "1"
tracing = "0.1"
# Checkpoint 09: portable async sleep for the discovery modal's search
# debounce (works on both the desktop and wasm targets).
futures-timer = "3"
# Trait seam + domain types live here; wasm gets this with default features
# off (no matrix-sdk), native additionally gets the real MatrixClient below.
client = { workspace = true, default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native-only: enables the `matrix` feature (matrix-sdk + runtime bridge).
client = { workspace = true, features = ["matrix"] }

# Checkpoint 07: native pick/save dialogs for attachments. Synchronous on
# the UI thread (the dialogs must not run on the backend's tokio thread).
# Desktop OSes only: rfd 0.15 has no Android backend (it fails to compile
# there), and wasm is excluded until web checkpoint 11. Android falls back
# to the no-op picker/save paths gated the same way in the source.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
rfd = "0.15"
