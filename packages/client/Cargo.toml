[package]
name = "client"
version = "0.1.0"
edition = "2021"

[features]
# Everything that links matrix-sdk. Native builds use this; wasm (`web`)
# consumes this crate with default features off and gets only the trait seam.
default = ["matrix"]
matrix = [
    "dep:matrix-sdk",
    "dep:matrix-sdk-ui",
    "dep:tokio",
    "dep:anyhow",
    "dep:tracing",
    "dep:directories",
    "dep:serde",
    "dep:serde_json",
    "dep:eyeball-im",
    "dep:futures",
    "dep:notify-rust",
    "dep:image",
    "dep:infer",
    "dep:base64",
    "dep:mime",
    "dep:getrandom",
    "dep:keyring",
    "dep:filetime",
]

[dependencies]
async-trait = "0.1"
matrix-sdk = { workspace = true, optional = true }
matrix-sdk-ui = { workspace = true, optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs"], optional = true }
anyhow = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }
directories = { version = "6", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# The backend publishes live data into Dioxus signals from the tokio runtime
# thread; `dioxus-signals` alone (not full dioxus) is the lightweight seam for
# that. Needed on wasm too, so NOT optional.
dioxus-signals = "0.7"
eyeball-im = { version = "0.8", optional = true }
futures = { version = "0.3", optional = true }
# Desktop notifications for incoming messages in background rooms
# (checkpoint 06). Native-only: tied to the `matrix` feature and cfg-gated
# off `wasm32` in the notification task itself — `notify-rust` has no web
# backend.
notify-rust = { version = "4", optional = true }
# Crypto-store passphrase generation (checkpoint 08); matches the SDK's
# getrandom tree.
getrandom = { version = "0.3", optional = true }
# Checkpoint 07 media: decode + downscale composer-picked images for
# thumbnails; sniff picked-file types; encode resolved media as data URIs.
# Minimal codec set keeps build time down; GIF stays server-thumbnailable
# (we don't generate static thumbs for it).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
infer = { version = "0.19", optional = true }
base64 = { version = "0.22", optional = true }
# Same version family as matrix-sdk re-exports (attachment::Thumbnail is
# typed over `mime::Mime`).
mime = { version = "0.3", optional = true }
# Media-cache LRU eviction needs portable mtime manipulation (checkpoint 11).
filetime = { version = "0.2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tempfile = "3"

# Checkpoint 11: session blob + crypto-store passphrase live in the OS
# keychain. keyring v4 ships backend stores as features, target-gated so
# each platform only pulls its own backend (an unconditional feature list
# would drag Windows-only crates into every graph). Linux deliberately has
# no backend here: headless/keyring-less installs take the loud file
# fallback in `secrets.rs` (a zbus secret-service backend is the documented
# follow-up).
[target.'cfg(target_os = "macos")'.dependencies]
# v1 = the app-facing Entry API; it transitively enables the apple backend
# store with its required `keychain` sub-feature (that store dep is itself
# target-gated inside keyring, so no Windows/Linux crates leak in here).
keyring = { version = "4", default-features = false, features = ["v1"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4", default-features = false, features = ["v1", "windows-native-keyring-store"], optional = true }
