[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
matrix-sdk = { workspace = true }
matrix-sdk-ui = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs"] }
async-trait = "0.1"
anyhow = "1"
tracing = "0.1"
futures = "0.3"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
